name: RoadVision checks
on:
  push:
    paths: ['mini-projects/roadvision-ai/**', '.github/workflows/roadvision.yml']
  pull_request:
    paths: ['mini-projects/roadvision-ai/**', '.github/workflows/roadvision.yml']
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-projects/roadvision-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
